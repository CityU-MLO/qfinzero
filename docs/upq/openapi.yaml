components:
  schemas:
    PairBar:
      type: object
      properties:
        ticker: {type: string, example: BTC-USD}
        base: {type: string, example: BTC}
        quote: {type: string, example: USD}
        window_start: {type: integer, format: int64, description: Minute start, ns since the Unix epoch (UTC), example: 1771891200000000000}
        open: {type: number, example: 64624.1}
        high: {type: number, example: 64650.0}
        low: {type: number, example: 64600.2}
        close: {type: number, example: 64640.5}
        volume: {type: number, example: 12.84}
        transactions: {type: integer, example: 311}
    PairDailyBar:
      type: object
      properties:
        ticker: {type: string, example: BTC-USD}
        base: {type: string, example: BTC}
        quote: {type: string, example: USD}
        date: {type: string, format: date, example: "2026-02-24"}
        open: {type: number, example: 64624.1}
        high: {type: number, example: 65094.0}
        low: {type: number, example: 62500.0}
        close: {type: number, example: 64061.9}
        volume: {type: number, example: 20134.07}
        transactions: {type: integer, example: 930852}
    FxQuote:
      type: object
      properties:
        ticker: {type: string, example: EUR-USD}
        base: {type: string, example: EUR}
        quote: {type: string, example: USD}
        window_start: {type: integer, format: int64, example: 1771804800000000000}
        bid_price: {type: number, example: 1.183}
        ask_price: {type: number, example: 1.18308}
    FutureMinuteRecord:
      type: object
      properties:
        ticker: {type: string, example: ZN}
        root: {type: string, example: ZN}
        instrument_id: {type: integer, format: int64, description: contract behind a continuous series; a change is a roll}
        window_start: {type: integer, format: int64}
        open: {type: number}
        high: {type: number}
        low: {type: number}
        close: {type: number}
        volume: {type: integer}
        transactions: {type: integer}
    FutureDailyRecord:
      type: object
      properties:
        ticker: {type: string}
        root: {type: string}
        date: {type: string, format: date, description: CME session date}
        open: {type: number}
        high: {type: number}
        low: {type: number}
        close: {type: number}
        settle: {type: number}
        settle_source: {type: string, enum: [exchange, last]}
        instrument_id: {type: integer, format: int64}
        volume: {type: integer}
        transactions: {type: integer}
    QuoteRecord:
      type: object
      properties:
        ticker: {type: string}
        window_start: {type: integer, format: int64, description: minute start, ns since epoch (UTC)}
        bid_price: {type: number, nullable: true}
        ask_price: {type: number, nullable: true}
        bid_size: {type: integer}
        ask_size: {type: integer}
    ChainSnapshotRecord:
      type: object
      properties:
        ticker: {type: string}
        underlying: {type: string}
        expiry: {type: string, format: date}
        strike: {type: number}
        type: {type: string, enum: [C, P]}
        last: {type: number, nullable: true}
        last_trade_ws: {type: integer, format: int64, nullable: true}
        volume: {type: integer}
        bid: {type: number, nullable: true}
        ask: {type: number, nullable: true}
        bid_size: {type: integer, nullable: true}
        ask_size: {type: integer, nullable: true}
        quote_ws: {type: integer, format: int64, nullable: true}
        mid: {type: number, nullable: true}
        iv_price: {type: number, description: price used for IV (with include_greeks)}
    StockMinuteRecord:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol
          example: "AAPL"
        window_start:
          type: integer
          description: Timestamp in nanoseconds since epoch
          example: 1736155800000000000
        open:
          type: number
          format: double
          description: Opening price
          example: 100.0
        high:
          type: number
          format: double
          description: High price
          example: 101.0
        low:
          type: number
          format: double
          description: Low price
          example: 99.0
        close:
          type: number
          format: double
          description: Closing price
          example: 100.5
        volume:
          type: integer
          description: Trading volume
          example: 1000
        transactions:
          type: integer
          description: Number of transactions
          example: 10

    StockDailyRecord:
      type: object
      properties:
        ticker:
          type: string
          description: Stock ticker symbol
        date:
          type: string
          format: date
          description: Trade date
          example: "2025-01-06"
        open:
          type: number
          format: double
        high:
          type: number
          format: double
        low:
          type: number
          format: double
        close:
          type: number
          format: double
        volume:
          type: integer
        transactions:
          type: integer

    OptionRecord:
      description: |
        Option ticker query row. Day resolution includes underlying/expiry/strike/type
        fields; minute resolution omits them. When include_greeks=true, Greek fields are appended.
      allOf:
        - type: object
          properties:
            ticker:
              type: string
              description: Option contract OPRA symbol
              example: "O:NVDA250117C00136000"
            underlying:
              type: string
              description: Underlying asset ticker (day resolution only)
            expiry:
              type: string
              format: date
              description: Option expiration date (day resolution only)
            strike:
              type: number
              format: double
              description: Strike price (day resolution only)
            type:
              type: string
              enum: [C, P]
              description: Option type, aliased from "right" column (day resolution only)
            window_start:
              type: integer
              description: Timestamp in nanoseconds
            open:
              type: number
              format: double
            high:
              type: number
              format: double
            low:
              type: number
              format: double
            close:
              type: number
              format: double
            volume:
              type: integer
            transactions:
              type: integer
        - $ref: '#/components/schemas/GreekFields'

    OptionChainRecord:
      description: |
        Option chain query row. When include_greeks=true, Greek fields are appended.
      allOf:
        - type: object
          properties:
            contract:
              type: string
              description: Option contract symbol
            underlying:
              type: string
              description: Underlying asset ticker
            expiry:
              type: string
              format: date
              description: Option expiration date
            strike:
              type: number
              format: double
              description: Strike price
            type:
              type: string
              enum: [C, P]
              description: Option type (Call or Put), aliased from "right" column
            window_start:
              type: integer
            open:
              type: number
              format: double
            high:
              type: number
              format: double
            low:
              type: number
              format: double
            close:
              type: number
              format: double
            volume:
              type: integer
            transactions:
              type: integer
        - $ref: '#/components/schemas/GreekFields'

    DividendRecord:
      type: object
      properties:
        ticker:
          type: string
          example: AAPL
        ex_dividend_date:
          type: string
          format: date
          example: "2025-02-10"
        amount:
          type: number
          description: Cash amount per share
          example: 0.25
    RateRecord:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Rate date
          example: "2025-01-02"
        yield_1_month:
          type: number
          format: double
          description: 1-month yield
        yield_3_month:
          type: number
          format: double
          description: 3-month yield
        yield_1_year:
          type: number
          format: double
          description: 1-year yield
        yield_2_year:
          type: number
          format: double
          description: 2-year yield
        yield_5_year:
          type: number
          format: double
          description: 5-year yield
        yield_10_year:
          type: number
          format: double
          description: 10-year yield
        yield_30_year:
          type: number
          format: double
          description: 30-year yield

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
          enum: [invalid_argument, internal_error]
          example: "invalid_argument"
        message:
          type: string
          description: Human-readable error message
          example: "start/end must be ISO datetime: YYYY-MM-DDTHH:MM:SS"

    FreshnessResponse:
      type: object
      properties:
        service:
          type: string
          example: "upq"
        checked_at:
          type: string
          format: date-time
          description: ISO timestamp when freshness was checked
        sources:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FreshnessSource'
          description: Map of data source name to freshness info
          example:
            stock_minute:
              latest_date: "2025-01-31"
              latest_timestamp: 1738339200000000000
              record_count: 50000
              unique_keys: 150
              unique_key_label: "tickers"
              partition_count: 22

    FreshnessSource:
      type: object
      properties:
        latest_date:
          type: string
          format: date
          nullable: true
          description: Latest partition date (YYYY-MM-DD)
        latest_timestamp:
          type: integer
          nullable: true
          description: Latest window_start in nanoseconds (for minute-resolution datasets)
        record_count:
          type: integer
          description: Number of records in the latest partition
        unique_keys:
          type: integer
          description: Number of unique tickers (or tenors for rates)
        unique_key_label:
          type: string
          description: Label for unique_keys (e.g., "tickers" or "tenors")
        partition_count:
          type: integer
          description: Total number of date partitions

    GreekFields:
      type: object
      description: |
        BSM-European Greeks fields. Appended to option rows when include_greeks=true.
        Warning: Uses European-style BSM approximation. May not be accurate for American-style options.
      properties:
        iv:
          type: number
          format: double
          nullable: true
          description: Implied volatility (annualized)
        delta:
          type: number
          format: double
          nullable: true
          description: Option delta
        gamma:
          type: number
          format: double
          nullable: true
          description: Option gamma
        theta:
          type: number
          format: double
          nullable: true
          description: Option theta (per day)
        vega:
          type: number
          format: double
          nullable: true
          description: Option vega (per 1% vol change)
        rho:
          type: number
          format: double
          nullable: true
          description: Option rho (per 1% rate change)
        greek_status:
          type: string
          enum: [ok, below_intrinsic, no_bracket, no_convergence, non_finite_input, near_expiry_approx, missing_spot, missing_rate, model_error]
          description: Status of Greeks computation for this row
        greek_meta:
          $ref: '#/components/schemas/GreekMeta'

    GreekMeta:
      type: object
      description: Metadata about the Greeks computation model and conventions
      properties:
        model:
          type: string
          example: "bsm_european"
        style_assumption:
          type: string
          example: "European"
        dividend_assumption:
          type: string
          example: "q0"
        theta_unit:
          type: string
          example: "per_day"
        vega_unit:
          type: string
          example: "per_1pct_vol"
        rho_unit:
          type: string
          example: "per_1pct_rate"
        spot_source:
          type: string
          example: "stock_daily"
        rate_source:
          type: string
          example: "rates_parquet"
        t_convention:
          type: string
          example: "calendar_days_over_365"
        expiry_anchor:
          type: string
          example: "expiry_date_16_00_ET"
