openapi: 3.0.0
info:
  title: UPQ API
  description: |
    UPQ (Rust Price Query Service) - Price query service with API compatibility against the Python price_query_service.
    
    ## Date/Time Formats
    - **ISO Datetime**: `YYYY-MM-DDTHH:MM:SS` (required for minute-level endpoints)
    - **Date**: `YYYY-MM-DD` (for daily endpoints)
    
    ## Error Responses
    All errors return JSON with `code` and `message` fields:
    ```json
    {
      "code": "invalid_argument",
      "message": "start/end must be ISO datetime: YYYY-MM-DDTHH:MM:SS"
    }
    ```
  version: 0.1.0
  contact:
    name: UPQ Team

servers:
  - url: http://localhost:19350
    description: Local development server

paths:
  /health:
    get:
      summary: Health Check
      description: Returns service health status
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /health/freshness:
    get:
      summary: Data Freshness
      description: |
        Returns data freshness information for all UPQ data sources.
        Reports latest timestamps, record counts, unique key counts, and partition info
        for each Parquet-partitioned dataset and the rates CSV.
      operationId: healthFreshness
      responses:
        '200':
          description: Freshness information for all data sources
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreshnessResponse'

  /stock:
    get:
      summary: Stock Minute Data
      description: |
        Query stock minute-level data. 
        **Note**: Requires ISO datetime format (YYYY-MM-DDTHH:MM:SS) for start/end.
      operationId: getStockMinute
      parameters:
        - name: tickers
          in: query
          required: true
          description: Comma-separated list of stock tickers (e.g., "AAPL,MSFT")
          schema:
            type: string
            example: "AAPL"
        - name: start
          in: query
          required: true
          description: Start datetime in ISO format (YYYY-MM-DDTHH:MM:SS)
          schema:
            type: string
            format: date-time
            example: "2025-01-06T09:30:00"
        - name: end
          in: query
          required: true
          description: End datetime in ISO format (YYYY-MM-DDTHH:MM:SS)
          schema:
            type: string
            format: date-time
            example: "2025-01-06T16:00:00"
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to return. Default includes all fields.
          schema:
            type: string
            example: "ticker,window_start,close"
        - name: limit
          in: query
          required: false
          description: Maximum rows to return (1-100000, default 10000)
          schema:
            type: integer
            minimum: 1
            maximum: 100000
            default: 10000
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: Successful query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMinuteRecord'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stock/daily:
    get:
      summary: Stock Daily Data
      description: |
        Query stock daily (OHLC) data.
        **Note**: Requires date format (YYYY-MM-DD) for start/end.
      operationId: getStockDaily
      parameters:
        - name: tickers
          in: query
          required: true
          description: Comma-separated list of stock tickers
          schema:
            type: string
            example: "AAPL"
        - name: start
          in: query
          required: true
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: end
          in: query
          required: true
          description: End date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-12-31"
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to return
          schema:
            type: string
            example: "ticker,date,close"
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
        - name: session
          in: query
          required: false
          description: >-
            regular (default): the exchange day. overnight: one bar per Blue
            Ocean ATS 20:00-04:00 ET session, dated by the trading day it
            precedes (Sunday night and Monday morning are Monday's session),
            final at 04:00 ET of that date.
          schema:
            type: string
            enum: [regular, overnight]
            default: regular
      responses:
        '200':
          description: Successful query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockDailyRecord'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /option:
    get:
      summary: Option Endpoints Metadata
      description: Returns available option query endpoints
      operationId: getOptionMetadata
      responses:
        '200':
          description: Metadata for option endpoints
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticker_query_path:
                    type: string
                    example: "/option/ticker_query"
                  chain_query_path:
                    type: string
                    example: "/option/chain_query"

  /option/ticker_query:
    get:
      summary: Option Ticker Query
      description: |
        Query option data by specific contract (ticker).
        Accepts date format (YYYY-MM-DD) or datetime format (YYYY-MM-DDTHH:MM:SS).
      operationId: getOptionByTicker
      parameters:
        - name: contract
          in: query
          required: true
          description: OPRA option contract symbol (e.g., "O:AAPL250117C00150000")
          schema:
            type: string
            example: "O:NVDA250117C00136000"
        - name: start
          in: query
          required: true
          description: Start date or datetime
          schema:
            type: string
            example: "2025-01-10"
        - name: end
          in: query
          required: true
          description: End date or datetime
          schema:
            type: string
            example: "2025-01-10"
        - name: resolution
          in: query
          required: false
          description: Data resolution (day or minute)
          schema:
            type: string
            enum: [day, minute]
            default: day
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to return
          schema:
            type: string
        - name: include_greeks
          in: query
          required: false
          description: |
            When true, compute and append BSM-European Greeks fields to each row.
            Warning: Greeks use European-style BSM approximation even for American-style options.
          schema:
            type: boolean
            default: false
        - name: greek_model
          in: query
          required: false
          description: Pricing model for Greeks computation (only "bsm" supported in V1)
          schema:
            type: string
            enum: [bsm]
            default: bsm
        - name: greek_price_field
          in: query
          required: false
          description: Which price field to use for IV inversion (only "close" supported in V1)
          schema:
            type: string
            enum: [close]
            default: close
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: Successful query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptionRecord'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /option/chain_query:
    get:
      summary: Option Chain Query
      description: |
        Query option chain by underlying asset with optional filters.
        Returns all options for a given underlying on a specific date.
        For exact expiry queries (`expiry_min == expiry_max`), if no rows match,
        the service automatically falls back to the nearest available expiry:
        first within ±7 calendar days, then (if still empty) within the same calendar month.
        Fallback candidate search stays within the same underlying/type/strike filter context.
        Nearest is selected by absolute day difference; ties pick the earlier expiry.
      operationId: getOptionChain
      parameters:
        - name: underlying
          in: query
          required: true
          description: Underlying asset ticker
          schema:
            type: string
            example: "NVDA"
        - name: date
          in: query
          required: true
          description: Trade date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-15"
        - name: expiry_min
          in: query
          required: false
          description: |
            Minimum expiration date filter.
            If `expiry_min` equals `expiry_max` and no exact rows exist,
            nearest-expiry fallback may apply.
          schema:
            type: string
            format: date
        - name: expiry_max
          in: query
          required: false
          description: |
            Maximum expiration date filter.
            If `expiry_min` equals `expiry_max` and no exact rows exist,
            nearest-expiry fallback may apply.
          schema:
            type: string
            format: date
        - name: strike_min
          in: query
          required: false
          description: Minimum strike price filter
          schema:
            type: number
            format: double
        - name: strike_max
          in: query
          required: false
          description: Maximum strike price filter
          schema:
            type: number
            format: double
        - name: type
          in: query
          required: false
          description: Option type filter (C for Call, P for Put)
          schema:
            type: string
            enum: [C, P]
        - name: fields
          in: query
          required: false
          description: Comma-separated fields to return
          schema:
            type: string
        - name: include_greeks
          in: query
          required: false
          description: |
            When true, compute and append BSM-European Greeks fields to each row.
            Warning: Greeks use European-style BSM approximation even for American-style options.
            When expiry fallback occurs, Greeks are computed using the actual returned expiry.
          schema:
            type: boolean
            default: false
        - name: greek_model
          in: query
          required: false
          description: Pricing model for Greeks computation (only "bsm" supported in V1)
          schema:
            type: string
            enum: [bsm]
            default: bsm
        - name: greek_price_field
          in: query
          required: false
          description: Which price field to use for IV inversion (only "close" supported in V1)
          schema:
            type: string
            enum: [close]
            default: close
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: Successful query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OptionChainRecord'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rates/query:
    get:
      summary: Treasury Yields Query
      description: Query treasury yield data for various tenors
      operationId: getRates
      parameters:
        - name: start
          in: query
          required: true
          description: Start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: end
          in: query
          required: true
          description: End date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-31"
        - name: tenors
          in: query
          required: false
          description: |
            Comma-separated list of tenors to return. 
            Available: 1M, 3M, 1Y, 2Y, 5Y, 10Y, 30Y
            Defaults to all if not specified.
          schema:
            type: string
            example: "1M,10Y"
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: Successful query
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RateRecord'
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dividends/query:
    get:
      summary: Dividends Query
      description: |
        Cash dividends by ex-dividend date for one or more stocks. With `as_of`,
        the end date is capped at the as-of date (ET).
      operationId: getDividends
      parameters:
        - name: tickers
          in: query
          required: true
          description: Comma-separated list of stock tickers
          schema:
            type: string
            example: "AAPL,MSFT"
        - name: start
          in: query
          required: true
          description: First ex-dividend date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-01-01"
        - name: end
          in: query
          required: true
          description: Last ex-dividend date (YYYY-MM-DD)
          schema:
            type: string
            format: date
            example: "2025-12-31"
        - name: as_of
          in: query
          required: false
          description: Point-in-time cap (ISO datetime or nanoseconds); see /rates/query.
          schema:
            type: string
            example: "2025-06-30T20:00:00Z"
      responses:
        '200':
          description: Dividends ordered by ticker and ex-dividend date (empty when none are stored)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DividendRecord'
              example:
                - { ticker: AAPL, ex_dividend_date: "2025-02-10", amount: 0.25 }
        '400':
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /stock/quote:
    get:
      summary: Stock minute NBBO
      description: |
        Top of book at the end of each minute [window_start, window_start + 60s).
        Minutes without a change are absent; carry the previous row forward.
      operationId: getStockQuote
      parameters:
        - {name: tickers, in: query, required: true, schema: {type: string, example: "SPY,QQQ"}}
        - {name: start, in: query, required: true, schema: {type: string, format: date-time, example: "2026-01-07T14:30:00"}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time, example: "2026-01-07T21:00:00"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: Quote rows
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QuoteRecord'}
  /option/quote:
    get:
      summary: Option contract minute NBBO
      operationId: getOptionQuote
      parameters:
        - {name: contract, in: query, required: true, schema: {type: string, example: "O:SPY260107C00690000"}}
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: Quote rows
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QuoteRecord'}
  /option/chain_snapshot:
    get:
      summary: Intraday option chain at a moment
      description: |
        Per contract: the last trade and its time, volume so far today, the latest
        bid/ask/size and mid, all from data final at `at` (capped by `as_of`).
        With include_greeks, IV and Greeks are priced off the mid (else the last
        trade) with the underlying's minute close at the same time.
      operationId: getOptionChainSnapshot
      parameters:
        - {name: underlying, in: query, required: true, schema: {type: string, example: "ANET"}}
        - {name: at, in: query, required: true, schema: {type: string, format: date-time, example: "2026-02-19T14:36:00"}}
        - {name: expiry_min, in: query, required: false, schema: {type: string, format: date}}
        - {name: expiry_max, in: query, required: false, schema: {type: string, format: date}}
        - {name: strike_min, in: query, required: false, schema: {type: number}}
        - {name: strike_max, in: query, required: false, schema: {type: number}}
        - {name: type, in: query, required: false, schema: {type: string, enum: [C, P]}}
        - {name: include_greeks, in: query, required: false, schema: {type: boolean, default: false}}
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime, UTC unless an offset is given, or
            nanoseconds). Only rows already final at this time are returned:
            minute rows once window_start + 60s <= as_of, stock daily bars after
            16:00 ET, option daily bars and the end-of-day chain after 16:15 ET.
            The service-wide ceiling UPQ_AS_OF applies as well.
          schema:
            type: string
            example: "2026-02-19T14:36:00Z"
      responses:
        '200':
          description: One row per contract
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ChainSnapshotRecord'}
  /future:
    get:
      summary: Futures minute bars
      description: |
        Partitions are CME sessions (18:00 ET the evening before to 17:00 ET), so
        evening bars belong to the next trade date.
      operationId: getFutureMinute
      parameters:
        - {name: tickers, in: query, required: false, description: "contracts (ZNZ6) or front-month roots (ZN); tickers or roots is required", schema: {type: string, example: "ZN,CL"}}
        - {name: roots, in: query, required: false, description: every series of these products, schema: {type: string, example: "ZN"}}
        - {name: start, in: query, required: true, schema: {type: string, format: date-time, example: "2026-09-01T22:00:00"}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time, example: "2026-09-02T21:00:00"}}
        - {name: fields, in: query, required: false, schema: {type: string, example: "ticker,window_start,close"}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime or nanoseconds). Minute rows are
            visible once window_start + 60s <= as_of; a futures daily bar for
            session D after 17:00 ET on D. UPQ_AS_OF applies as well.
          schema: {type: string, example: "2026-09-02T14:36:00Z"}
      responses:
        '200':
          description: Bars
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FutureMinuteRecord'}
  /future/daily:
    get:
      summary: Futures daily bars with settle
      description: One bar per CME session; `settle` is the price daily variation margin marks to.
      operationId: getFutureDaily
      parameters:
        - {name: tickers, in: query, required: false, description: "contracts (ZNZ6) or front-month roots (ZN); tickers or roots is required", schema: {type: string, example: "ZN,CL"}}
        - {name: roots, in: query, required: false, description: every series of these products, schema: {type: string, example: "ZN"}}
        - {name: start, in: query, required: true, schema: {type: string, format: date, example: "2026-09-01"}}
        - {name: end, in: query, required: true, schema: {type: string, format: date, example: "2026-09-30"}}
        - {name: fields, in: query, required: false, schema: {type: string, example: "ticker,date,settle"}}
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime or nanoseconds). Minute rows are
            visible once window_start + 60s <= as_of; a futures daily bar for
            session D after 17:00 ET on D. UPQ_AS_OF applies as well.
          schema: {type: string, example: "2026-09-02T14:36:00Z"}
      responses:
        '200':
          description: Bars
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/FutureDailyRecord'}
  /future/quote:
    get:
      summary: Futures top of book
      description: The book at the end of each kept minute; carry the previous row forward.
      operationId: getFutureQuote
      parameters:
        - {name: tickers, in: query, required: false, description: "contracts (ZNZ6) or front-month roots (ZN); tickers or roots is required", schema: {type: string, example: "ZN,CL"}}
        - {name: roots, in: query, required: false, description: every series of these products, schema: {type: string, example: "ZN"}}
        - {name: start, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: end, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100000, default: 10000}}
        - name: as_of
          in: query
          required: false
          description: >-
            Point-in-time cap (ISO datetime or nanoseconds). Minute rows are
            visible once window_start + 60s <= as_of; a futures daily bar for
            session D after 17:00 ET on D. UPQ_AS_OF applies as well.
          schema: {type: string, example: "2026-09-02T14:36:00Z"}
      responses:
        '200':
          description: Quote rows (QuoteRecord plus root)
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/QuoteRecord'}
  /crypto:
    get:
      summary: Crypto Minute Bars
      description: |
        Minute bars of crypto pairs (massive global crypto). Days are UTC days.
      operationId: getCryptoMinute
      parameters:
        - name: tickers
          in: query
          required: true
