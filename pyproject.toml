[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qfinzero"
version = "0.1.0"
description = "A unified, replayable trading environment for LLM agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "QFinZero contributors"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-asyncio>=0.24", "responses>=0.25"]
# Data pipeline (raw-source management + UPQ conversion). DuckDB mirrors the
# UPQ Rust ingester so emitted parquet is byte-compatible.
pipeline = ["duckdb>=1.0", "pyarrow>=15", "polars>=1.0"]
# Databento DBN reader + historical API client (``--vendor databento``,
# ``qfz-data acquire databento``). Parquet exports convert without it.
databento = ["databento>=0.60", "duckdb>=1.0", "pyarrow>=15"]
# Unified hub server (:19777 fronting Web UI + REST + MCP).
server = [
    "aiosqlite>=0.19",
    "fastapi>=0.111",
    "httpx>=0.27",
    "langchain>=1.2",
    "langchain-mcp-adapters>=0.2",
    "langchain-openai>=1.1",
    "langgraph>=1.0",
    "mcp[cli]>=1.10,<2",
    "motor>=3.3",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
qfz-data = "qfinzero.pipeline.cli:main"
qfz-research = "qfinzero.research.cli:main"
qfz-server = "qfinzero.server.__main__:main"

[project.urls]
Repository = "https://github.com/CityU-MLO/qfinzero"
Issues = "https://github.com/CityU-MLO/qfinzero/issues"

[tool.setuptools]
packages = [
    "qfinzero",
    "qfinzero.admin",
    "qfinzero.pipeline",
    "qfinzero.pipeline.sources",
    "qfinzero.research",
    "qfinzero.update",
    "qfinzero.update.loaders",
    "qfinzero.server",
    "qfinzero.clients",
    "qfinzero.clients.pmb",
    "qfinzero.clients.upq",
    "qfinzero.clients.esp",
]

[tool.setuptools.package-dir]
"qfinzero" = "qfinzero"
"qfinzero.clients" = "clients"
"qfinzero.clients.pmb" = "clients/pmb"
"qfinzero.clients.upq" = "clients/upq"
"qfinzero.clients.esp" = "clients/esp"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
